<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="Golos Text, Arial, sans-serif">
  <title>Схема проезда к зданию департамента</title>
  <rect width="560" height="380" fill="#eef3ec"/>
  <!-- парк -->
  <path d="M20 250 C60 220 120 230 160 260 L170 360 L20 360 Z" fill="#cfe3c8"/>
  <g fill="#7fae74"><circle cx="60" cy="300" r="10"/><circle cx="90" cy="320" r="12"/><circle cx="120" cy="290" r="9"/><circle cx="70" cy="340" r="8"/><circle cx="140" cy="330" r="10"/></g>
  <text x="58" y="275" font-size="12" fill="#3f6b3a">Сквер Лесников</text>
  <!-- река -->
  <path d="M380 0 C400 90 360 160 420 230 C470 290 450 340 470 380 L560 380 L560 0 Z" fill="#b7d9ee"/>
  <text x="470" y="120" font-size="13" fill="#2f6a8d" transform="rotate(70 470 120)">р. Заречная</text>
  <!-- улицы -->
  <g stroke="#ffffff" stroke-width="22" stroke-linecap="round">
    <line x1="0" y1="180" x2="390" y2="180"/>
    <line x1="230" y1="0" x2="230" y2="380"/>
    <line x1="40" y1="60" x2="230" y2="60"/>
  </g>
  <g fill="#7a8a80" font-size="12">
    <text x="20" y="168">ул. Лесная</text>
    <text x="238" y="30" transform="rotate(90 238 30)">пр. Победы</text>
    <text x="60" y="50">ул. Кедровая</text>
  </g>
  <!-- здания -->
  <g fill="#d9ddd6"><rect x="40" y="80" width="70" height="70" rx="3"/><rect x="125" y="80" width="80" height="70" rx="3"/><rect x="255" y="80" width="90" height="70" rx="3"/><rect x="255" y="205" width="100" height="80" rx="3"/><rect x="180" y="205" width="30" height="40" rx="3"/></g>
  <!-- здание департамента -->
  <rect x="125" y="196" width="80" height="60" rx="4" fill="#1f5a33"/>
  <text x="165" y="231" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">д. 12</text>
  <!-- остановка -->
  <g transform="translate(262,166)"><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#d9861c"/><text x="0" y="5" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">А</text></g>
  <text x="280" y="160" font-size="12" fill="#7a4706">ост. «Площадь Лесников»</text>
  <!-- метка -->
  <g transform="translate(165,186)">
    <path d="M0 0 C-14 -16 -14 -36 0 -36 C14 -36 14 -16 0 0 Z" fill="#d9861c" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="-24" r="5" fill="#fff"/>
  </g>
  <rect x="300" y="320" width="240" height="44" rx="8" fill="#ffffff" stroke="#d7e1d9"/>
  <text x="315" y="338" font-size="12" fill="#1d2620" font-weight="700">Департамент лесного хозяйства</text>
  <text x="315" y="354" font-size="12" fill="#5c6a60">г. Заречинск, ул. Лесная, д. 12</text>
</svg>
